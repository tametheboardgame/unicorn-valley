name: R2-WP2.6A browser diagnostic

on:
  push:
    branches:
      - agent/r2-wp2.6a-blocker-fixes

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install project and diagnostic browser client
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false puppeteer-core
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/unicorn-vite.log 2>&1 &
          echo $! > /tmp/unicorn-vite.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/unicorn-vite.log
          exit 1
      - name: Exercise creator typing and cottage transitions
        run: |
          export CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          echo "Chrome: $CHROME_PATH"
          timeout 90s node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox'],
          });

          const pause = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function collectPage(label) {
            const page = await browser.newPage();
            page.setDefaultNavigationTimeout(10000);
            page.setDefaultTimeout(10000);
            const errors = [];
            page.on('pageerror', (error) => {
              errors.push(`pageerror: ${error.stack || error.message}`);
              console.error(`[${label}] PAGE ERROR`, error.stack || error.message);
            });
            page.on('console', (message) => {
              if (message.type() === 'error') {
                errors.push(`console: ${message.text()}`);
                console.error(`[${label}] CONSOLE ERROR`, message.text());
              }
            });
            return { page, errors };
          }

          async function activeScenes(page) {
            return page.evaluate(() =>
              globalThis.__unicornValleyGame?.scene
                .getScenes(true)
                .map((scene) => scene.scene.key) ?? [],
            );
          }

          async function waitForScene(page, sceneKey) {
            await page.waitForFunction(
              (expectedScene) =>
                globalThis.__unicornValleyGame?.scene
                  .getScenes(true)
                  .some((scene) => scene.scene.key === expectedScene) === true,
              { timeout: 10000 },
              sceneKey,
            );
          }

          async function holdInteractionUntilScene(page, sceneKey) {
            await page.keyboard.down('KeyE');
            await waitForScene(page, sceneKey);
            await pause(500);
            const scenesWhileHeld = await activeScenes(page);
            console.log(`HELD_E_${sceneKey}=` + scenesWhileHeld.join(','));
            if (!scenesWhileHeld.includes(sceneKey)) {
              throw new Error(`Held interaction did not settle in ${sceneKey}.`);
            }
            await page.keyboard.up('KeyE');
            await pause(150);
          }

          console.log('START creator');
          const creator = await collectPage('creator');
          await creator.page.goto('http://127.0.0.1:5173/?scene=creator', {
            waitUntil: 'domcontentloaded',
          });
          await creator.page.waitForSelector('.unicorn-name-input');
          const input = await creator.page.$('.unicorn-name-input');
          await input.click();
          await creator.page.keyboard.down('Control');
          await creator.page.keyboard.press('KeyA');
          await creator.page.keyboard.up('Control');
          await creator.page.keyboard.press('Backspace');
          const expectedName = 'WASDEBI Star';
          await creator.page.keyboard.type(expectedName, { delay: 20 });
          const typedName = await creator.page.$eval('.unicorn-name-input', (element) => element.value);
          console.log('CREATOR_TYPED_NAME=' + typedName);
          await creator.page.close();

          console.log('START cottage-direct');
          const cottage = await collectPage('cottage-direct');
          await cottage.page.goto('http://127.0.0.1:5173/?scene=cottage', {
            waitUntil: 'domcontentloaded',
          });
          await waitForScene(cottage.page, 'CottageInteriorScene');
          await pause(700);
          console.log('COTTAGE_DIRECT_SCENES=' + (await activeScenes(cottage.page)).join(','));
          console.log('COTTAGE_DIRECT_ERRORS=' + cottage.errors.length);

          await cottage.page.evaluate(() => {
            const raw = globalThis.localStorage.getItem('unicorn-valley.save');
            if (!raw) {
              throw new Error('Expected cottage entry to create a browser save.');
            }
            const save = JSON.parse(raw);
            save.inventory.itemQuantities['item:moonflower-lantern'] = 1;
            globalThis.localStorage.setItem('unicorn-valley.save', JSON.stringify(save));
          });
          await cottage.page.reload({ waitUntil: 'domcontentloaded' });
          await waitForScene(cottage.page, 'CottageInteriorScene');
          await pause(700);
          console.log('COTTAGE_REWARD_ERRORS=' + cottage.errors.length);
          await cottage.page.screenshot({ path: '/tmp/cottage-direct.png' });
          await cottage.page.close();

          console.log('START cottage-transition');
          const transition = await collectPage('cottage-transition');
          await transition.page.goto('http://127.0.0.1:5173/?scene=glade', {
            waitUntil: 'domcontentloaded',
          });
          await waitForScene(transition.page, 'MoonflowerGladeScene');
          await transition.page.evaluate(() => {
            const game = globalThis.__unicornValleyGame;
            const scene = game?.scene.getScene('MoonflowerGladeScene');
            const player = scene?.player;
            if (!player?.sprite) {
              throw new Error('Glade diagnostic could not find the player sprite.');
            }
            player.sprite.setPosition(560, 720);
            player.sprite.body?.reset?.(560, 720);
          });
          await pause(250);
          const gladeTarget = await transition.page.evaluate(() => {
            const game = globalThis.__unicornValleyGame;
            return game?.scene.getScene('MoonflowerGladeScene')?.activeInteraction?.id ?? null;
          });
          console.log('GLADE_TARGET=' + gladeTarget);
          if (gladeTarget !== 'interaction:moonflower-cottage-door') {
            throw new Error(`Expected cottage interaction target, got ${gladeTarget}.`);
          }

          await holdInteractionUntilScene(transition.page, 'CottageInteriorScene');
          const enteredScenes = await activeScenes(transition.page);
          console.log('AFTER_ENTER_SCENES=' + enteredScenes.join(','));

          await transition.page.keyboard.down('KeyE');
          await pause(500);
          await transition.page.keyboard.up('KeyE');
          const postEntryScenes = await activeScenes(transition.page);
          console.log('AFTER_ENTRY_E_SCENES=' + postEntryScenes.join(','));
          if (!postEntryScenes.includes('CottageInteriorScene')) {
            throw new Error('Cottage immediately exited after entry input.');
          }

          await transition.page.evaluate(() => {
            const game = globalThis.__unicornValleyGame;
            const scene = game?.scene.getScene('CottageInteriorScene');
            const player = scene?.player;
            if (!player?.sprite) {
              throw new Error('Cottage diagnostic could not find the player sprite.');
            }
            player.sprite.setPosition(900, 1010);
            player.sprite.body?.reset?.(900, 1010);
          });
          await pause(250);
          const cottageTarget = await transition.page.evaluate(() => {
            const game = globalThis.__unicornValleyGame;
            return game?.scene.getScene('CottageInteriorScene')?.activeInteraction?.id ?? null;
          });
          console.log('COTTAGE_TARGET=' + cottageTarget);
          if (cottageTarget !== 'interaction:cottage-exit') {
            throw new Error(`Expected cottage exit target, got ${cottageTarget}.`);
          }

          await holdInteractionUntilScene(transition.page, 'MoonflowerGladeScene');
          const exitedScenes = await activeScenes(transition.page);
          console.log('AFTER_EXIT_SCENES=' + exitedScenes.join(','));
          if (!exitedScenes.includes('MoonflowerGladeScene')) {
            throw new Error('Cottage exit did not settle in Moonflower Glade.');
          }

          console.log('COTTAGE_TRANSITION_ERRORS=' + transition.errors.length);
          await transition.page.screenshot({ path: '/tmp/cottage-transition.png' });

          const allErrors = [...creator.errors, ...cottage.errors, ...transition.errors];
          await transition.page.close();
          await browser.close();

          if (typedName !== expectedName) {
            console.error(`CREATOR_TYPING_FAILED expected=${expectedName} actual=${typedName}`);
            process.exitCode = 1;
          }
          if (allErrors.length > 0) {
            console.error(`BROWSER_ERRORS=${allErrors.length}`);
            process.exitCode = 1;
          }
          NODE
      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-wp2.6a-browser-diagnostic
          path: |
            /tmp/cottage-direct.png
            /tmp/cottage-transition.png
          if-no-files-found: ignore
