name: WP2.10A star patch

on:
  push:
    branches:
      - agent/r2-wp2-10a-visual-polish-ux-fix-pass
    paths:
      - scripts/wp2_10a_star_patch.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2-10a-visual-polish-ux-fix-pass
      - name: Apply star patch
        run: node scripts/wp2_10a_star_patch.mjs
      - name: Commit renderer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/player/UnicornAppearanceRenderer.ts
          git diff --cached --quiet || git commit -m "R2-WP2.10A fix star rendering compatibility"
          git push
