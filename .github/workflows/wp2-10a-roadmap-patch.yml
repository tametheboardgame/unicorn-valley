name: WP2.10A roadmap patch

on:
  push:
    branches:
      - agent/r2-wp2-10a-visual-polish-ux-fix-pass
    paths:
      - scripts/wp2_10a_roadmap_patch.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2-10a-visual-polish-ux-fix-pass
      - name: Apply roadmap amendment
        run: node scripts/wp2_10a_roadmap_patch.mjs
      - name: Commit roadmap amendment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/06-ROADMAP.md docs/07-WORK-PACKAGES.md
          git diff --cached --quiet || git commit -m "R2-WP2.10A split visual polish from daughter playtest"
          git push
