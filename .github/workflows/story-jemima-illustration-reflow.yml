name: Reflow Jemima Illustrated Classic

on:
  push:
    branches:
      - agent/story-house-jemima-full-classic

permissions:
  contents: write

jobs:
  reflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/story-house-jemima-full-classic

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Reflow classic text around restored illustrations
        shell: python
        run: |
          import json
          import re
          import shutil
          from pathlib import Path

          story_dir = Path("public/stories/the-tale-of-jemima-puddle-duck")
          manifest_path = story_dir / "book.json"
          pages_dir = story_dir / "editions/full-classic/pages"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          edition = next(item for item in manifest["editions"] if item["id"] == "full-classic")

          flat = []
          for chapter in edition["chapters"]:
              markdown = (story_dir / chapter["path"]).read_text(encoding="utf-8")
              matches = list(re.finditer(r"<!--\s*block:([A-Za-z0-9_-]+)\s*-->", markdown))
              illustrations_by_block = {}
              for illustration in chapter.get("illustrations", []):
                  illustrations_by_block.setdefault(illustration["blockId"], []).append(illustration)

              for index, match in enumerate(matches):
                  end = matches[index + 1].start() if index + 1 < len(matches) else len(markdown)
                  text = markdown[match.end():end].strip()
                  flat.append({
                      "text": text,
                      "illustrations": illustrations_by_block.get(match.group(1), []),
                  })

          def wc(value):
              return len(re.findall(r"[A-Za-z0-9]+(?:['’.-][A-Za-z0-9]+)*", value))

          pages = []
          current = []
          words = 0
          images = 0

          for block in flat:
              bw = wc(block["text"])
              bi = len(block["illustrations"])
              should_break = bool(current) and (
                  (words >= 85 and words + bw > 145)
                  or (images >= 1 and images + bi > 3)
                  or images >= 3
              )
              if should_break:
                  pages.append(current)
                  current = []
                  words = 0
                  images = 0

              current.append(block)
              words += bw
              images += bi

          if current:
              pages.append(current)

          if len(pages) > 1:
              last_words = sum(wc(block["text"]) for block in pages[-1])
              last_images = sum(len(block["illustrations"]) for block in pages[-1])
              prev_words = sum(wc(block["text"]) for block in pages[-2])
              prev_images = sum(len(block["illustrations"]) for block in pages[-2])
              if last_words < 60 and prev_words + last_words <= 165 and prev_images + last_images <= 4:
                  pages[-2].extend(pages[-1])
                  pages.pop()

          temp_dir = pages_dir.parent / "pages-reflow"
          if temp_dir.exists():
              shutil.rmtree(temp_dir)
          temp_dir.mkdir(parents=True)

          new_chapters = []
          total_images = 0
          for page_index, blocks in enumerate(pages, start=1):
              page_id = f"page-{page_index:02d}"
              output = []
              page_illustrations = []

              for block_index, block in enumerate(blocks, start=1):
                  new_block_id = f"p{page_index:02d}-b{block_index:02d}"
                  output.extend([
                      f"<!-- block:{new_block_id} -->",
                      block["text"],
                      "",
                  ])
                  for illustration in block["illustrations"]:
                      item = dict(illustration)
                      item["blockId"] = new_block_id
                      page_illustrations.append(item)

              (temp_dir / f"{page_id}.md").write_text(
                  "\n".join(output).rstrip() + "\n",
                  encoding="utf-8",
              )

              chapter = {
                  "id": page_id,
                  "title": "The Tale of Jemima Puddle-Duck"
                  if page_index == 1
                  else "The Tale of Jemima Puddle-Duck (continued)",
                  "path": f"editions/full-classic/pages/{page_id}.md",
              }
              if page_illustrations:
                  chapter["illustrations"] = page_illustrations
              total_images += len(page_illustrations)
              new_chapters.append(chapter)

              print(
                  f"{page_id}: {sum(wc(block['text']) for block in blocks)} words, "
                  f"{len(page_illustrations)} illustrations"
              )

          if total_images != 25:
              raise RuntimeError(f"Expected 25 illustrations after reflow, found {total_images}.")

          if pages_dir.exists():
              shutil.rmtree(pages_dir)
          temp_dir.rename(pages_dir)

          edition["chapters"] = new_chapters
          edition["rights"]["curatorNotes"] = (
              f"Complete original text reflowed into {len(new_chapters)} reader pages at paragraph "
              "boundaries, with all 25 narrative illustrations from the Project Gutenberg 1908 "
              "edition restored at their matching passage anchors. The original, harsher ending "
              "is preserved in Full Classic Text."
          )

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Reflowed Jemima to {len(new_chapters)} illustrated reader pages.")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format manifest
        run: npx biome format --write public/stories/the-tale-of-jemima-puddle-duck/book.json

      - name: Regenerate catalogue
        run: npm run story:catalogue

      - name: Focused tests and typecheck
        run: |
          npx vitest run src/game/storyLibrary/StoryLibraryService.test.ts src/game/storyLibrary/StoryReadingService.test.ts
          npm run typecheck

      - name: Commit reflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-tale-of-jemima-puddle-duck public/stories/catalogue.json
          git commit -m "Story House: reflow illustrated Jemima classic"
          git push origin HEAD:agent/story-house-jemima-full-classic
