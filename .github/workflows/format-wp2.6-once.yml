name: Format WP2.6 once

on:
  push:
    branches:
      - agent/r2-wp2.6-cottage-interior

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2.6-cottage-interior
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Format repository and remove helper
        run: |
          npm run format
          rm .github/workflows/format-wp2.6-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Format WP2.6 repository"
          git push
