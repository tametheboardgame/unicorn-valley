name: Materialise Peter Rabbit Full Classic Text

on:
  push:
    branches:
      - agent/story-house-peter-rabbit-full-classic

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-peter-rabbit-full-classic

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Download complete public-domain Peter Rabbit text
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://www.gutenberg.org/cache/epub/14838/pg14838.txt" \
            -o /tmp/peter-rabbit.txt

      - name: Build paged Full Classic Text edition
        shell: python
        run: |
          import json
          import re
          import shutil
          from pathlib import Path

          story_dir = Path("public/stories/the-tale-of-peter-rabbit")
          manifest_path = story_dir / "book.json"
          source_path = Path("/tmp/peter-rabbit.txt")
          pages_dir = story_dir / "editions/full-classic/pages"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != 1:
              raise RuntimeError("Peter Rabbit materialiser expected the existing schema v1 Story House package.")

          source = source_path.read_text(encoding="utf-8").replace("\r\n", "\n")
          start = source.find("Once upon a time there were four little Rabbits")
          end = source.find("\nTHE END", start)
          if start < 0 or end < 0:
              raise RuntimeError("Could not isolate the Peter Rabbit story text.")
          story = source[start:end].strip()

          blocks = []
          for raw in re.split(r"\n\s*\n", story):
              raw = raw.strip("\n")
              if not raw.strip():
                  continue
              if raw.strip() == "[Illustration]":
                  continue

              lines = raw.splitlines()
              if all((not line.strip()) or line.lstrip().startswith("[Illustration]") for line in lines):
                  continue

              # Preserve wording while removing source-file hard wraps.
              if any(line.startswith("   ") for line in lines):
                  text = " ".join(line.strip() for line in lines if line.strip() and line.strip() != "[Illustration]")
              else:
                  text = " ".join(line.strip() for line in lines if line.strip() and line.strip() != "[Illustration]")

              text = re.sub(r" {2,}", " ", text).strip()
              if text:
                  blocks.append(text)

          full_text = " ".join(blocks)
          word_count = len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*", full_text))
          if not (850 <= word_count <= 1300):
              raise RuntimeError(f"Unexpected Peter Rabbit word count: {word_count}")

          target_words = 220
          max_words = 285
          pages = []
          current = []
          current_words = 0

          for block in blocks:
              block_words = len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*", block))
              if current and current_words >= target_words and current_words + block_words > max_words:
                  pages.append(current)
                  current = []
                  current_words = 0

              current.append(block)
              current_words += block_words

              if current_words >= max_words:
                  pages.append(current)
                  current = []
                  current_words = 0

          if current:
              pages.append(current)

          if len(pages) > 1:
              last_words = len(re.findall(r"[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*", " ".join(pages[-1])))
              if last_words < 120:
                  pages[-2].extend(pages[-1])
                  pages.pop()

          if not (4 <= len(pages) <= 7):
              raise RuntimeError(f"Expected 4-7 reader pages, generated {len(pages)}.")

          if pages_dir.exists():
              shutil.rmtree(pages_dir)
          pages_dir.mkdir(parents=True, exist_ok=True)

          # Reuse the existing original Potter illustrations at the matching scenes.
          illustration_specs = [
              ("potter-rabbit-family", "rabbit-family.webp", "four little Rabbits",
               "Beatrix Potter's illustration of Peter Rabbit with his family.", 469, 511),
              ("potter-garden", "garden.webp", "First he ate some lettuces",
               "An original Beatrix Potter illustration from The Tale of Peter Rabbit.", 431, 528),
              ("potter-escape", "escape.webp", "Peter got down very quietly",
               "An original Beatrix Potter illustration from Peter Rabbit's escape.", 408, 530),
              ("potter-home", "home.webp", "Peter never stopped running",
               "Beatrix Potter's illustration of Mrs Rabbit and the rabbit family.", 446, 505),
          ]

          full_chapters = []
          illustration_used = set()

          for page_index, page_blocks in enumerate(pages, start=1):
              page_id = f"page-{page_index:02d}"
              page_path = f"editions/full-classic/pages/{page_id}.md"
              page_lines = []
              block_ids = []

              for block_index, block in enumerate(page_blocks, start=1):
                  block_id = f"p{page_index:02d}-b{block_index:02d}"
                  block_ids.append(block_id)
                  page_lines.append(f"<!-- block:{block_id} -->")
                  page_lines.append(block)
                  page_lines.append("")

              (story_dir / page_path).write_text(
                  "\n".join(page_lines).rstrip() + "\n",
                  encoding="utf-8",
              )

              page_manifest = {
                  "id": page_id,
                  "title": "The Tale of Peter Rabbit" if page_index == 1 else "The Tale of Peter Rabbit (continued)",
                  "path": page_path,
              }

              page_text = " ".join(page_blocks)
              page_illustrations = []
              for illustration_id, filename, marker, alt, width, height in illustration_specs:
                  if marker in page_text and illustration_id not in illustration_used:
                      block_index = next(
                          i for i, block in enumerate(page_blocks)
                          if marker in block
                      )
                      page_illustrations.append({
                          "id": f"full-{illustration_id}",
                          "blockId": block_ids[block_index],
                          "path": f"illustrations/{filename}",
                          "alt": alt,
                          "placement": "full-width",
                          "width": width,
                          "height": height,
                          "caption": "Illustration by Beatrix Potter, 1902.",
                      })
                      illustration_used.add(illustration_id)

              if page_illustrations:
                  page_manifest["illustrations"] = page_illustrations

              full_chapters.append(page_manifest)

          story_house_edition = {
              "id": "story-house",
              "label": "Story House Edition",
              "author": manifest["author"],
              "readingMode": manifest.get("readingMode", "flowing"),
              "rights": manifest["rights"],
              "chapters": manifest["chapters"],
          }

          full_classic_edition = {
              "id": "full-classic",
              "label": "Full Classic Text",
              "author": "Beatrix Potter",
              "readingMode": "paged-prose",
              "rights": {
                  "text": {
                      "status": "public-domain",
                      "source": "Beatrix Potter's 1902 text, transcribed in Project Gutenberg eBook #14838",
                      "sourceUrl": "https://www.gutenberg.org/ebooks/14838",
                      "notes": (
                          "Complete story text. Project Gutenberg header, footer, licence text and "
                          "standalone [Illustration] placeholders are excluded; wording is not "
                          "abridged or modernised."
                      ),
                  },
                  "illustrations": manifest["rights"].get("illustrations"),
                  "edition": {
                      "status": "public-domain",
                      "source": "1902 Beatrix Potter text and illustrations",
                      "notes": "Story House pagination is presentation only; the original wording remains unabridged.",
                  },
                  "originalPublicationYear": 1902,
                  "curatorNotes": (
                      f"Complete original text split into {len(pages)} reader pages at paragraph "
                      "boundaries, with original Potter illustrations reused at matching scenes."
                  ),
              },
              "chapters": full_chapters,
          }

          converted = {
              "schemaVersion": 2,
              "id": manifest["id"],
              "title": manifest["title"],
              "description": manifest["description"],
              "catalogueBlurb": manifest.get("catalogueBlurb"),
              "cover": manifest.get("cover"),
              "series": manifest.get("series"),
              "tags": manifest["tags"],
              "publication": manifest["publication"],
              "discovery": manifest["discovery"],
              "defaultEditionId": "story-house",
              "editions": [story_house_edition, full_classic_edition],
          }

          manifest_path.write_text(
              json.dumps(converted, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              f"Materialised Peter Rabbit Full Classic Text: {word_count} words, "
              f"{len(pages)} reader pages, {len(illustration_used)} reused illustrations."
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format manifest
        run: npx biome format --write public/stories/the-tale-of-peter-rabbit/book.json

      - name: Regenerate Story House catalogue
        run: npm run story:catalogue

      - name: Run focused Story House tests
        run: npx vitest run src/game/storyLibrary/StoryLibraryService.test.ts src/game/storyLibrary/StoryReadingService.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit materialised classic edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/stories/the-tale-of-peter-rabbit \
            public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Peter Rabbit Full Classic Text"
          git push origin HEAD:agent/story-house-peter-rabbit-full-classic
