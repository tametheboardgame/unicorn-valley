name: Finalize R1 WP1.8 Once

on:
  push:
    branches:
      - agent/r1-wp1.8-first-playable-hardening

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[r1-wp1.8-validated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r1-wp1.8-first-playable-hardening

      - name: Confirm hardening integration exists
        run: |
          grep -q "TouchMovementPad" src/game/scenes/MoonflowerGladeScene.ts
          grep -q "resetArmed" src/game/scenes/TitleScene.ts
          grep -q "saveLocationCheckpoint" src/game/scenes/MoonflowerGladeScene.ts
          test ! -f .github/workflows/wire-r1-hardening-once.yml
          test ! -f .github/workflows/cleanup-r1-hardening-once.yml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update R1 status and remove this helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = """**R1-WP1.7 - Wonderbook Shell implemented and validated.**

          R0 is complete and deployed to `https://unicorn-valley.pages.dev/`.

          The next implementation package is **R1-WP1.8 - First Playable Hardening**."""
          new = """**R1-WP1.8 - First Playable Hardening implemented and validated.**

          R0 is complete and deployed to `https://unicorn-valley.pages.dev/`.

          R1 implementation packages WP1.1-WP1.8 are complete. R2 must not start until the first playable has hands-on sign-off."""
          assert old in text
          text = text.replace(old, new, 1)
          marker = "- [Wonderbook Shell](docs/16-WONDERBOOK-SHELL.md)"
          assert marker in text
          text = text.replace(
              marker,
              marker + "\n- [R1 First Playable Hardening](docs/17-FIRST-PLAYABLE-HARDENING.md)",
              1,
          )
          path.write_text(text)
          PY
          rm .github/workflows/finalize-r1-wp1.8-once.yml
          npx biome format --write README.md

      - name: Validate exact final tree
        run: npm run validate

      - name: Commit validated final state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize R1 WP1.8 [r1-wp1.8-validated]"
          git push
