name: WP19D final formatter

on:
  push:
    branches:
      - agent/r6.5-wp19d-unified-interactions-npcs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6.5-wp19d-unified-interactions-npcs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx biome format --write src/game/activities/FireflyLanternWorldManager.ts src/game/story/LumiWoodsWorldManager.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/activities/FireflyLanternWorldManager.ts src/game/story/LumiWoodsWorldManager.ts
          git commit -m "WP19D apply final interaction formatting"
          git push
