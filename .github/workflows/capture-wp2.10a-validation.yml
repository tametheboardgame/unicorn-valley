name: Capture WP2.10A validation output

on:
  push:
    branches:
      - agent/r2-wp2-10a-visual-polish-ux-fix-pass
    paths-ignore:
      - wp2.10a-validation-output.txt

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2-10a-visual-polish-ux-fix-pass
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture validation
        shell: bash
        run: |
          set +e
          npm run validate > wp2.10a-validation-output.txt 2>&1
          status=$?
          echo "" >> wp2.10a-validation-output.txt
          if [ "$status" -eq 0 ]; then
            echo "__VALIDATION_PASSED__" >> wp2.10a-validation-output.txt
          else
            echo "__VALIDATION_FAILED__:$status" >> wp2.10a-validation-output.txt
          fi
          exit 0
      - name: Commit captured output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp2.10a-validation-output.txt
          git diff --cached --quiet || git commit -m "Capture WP2.10A validation output"
          git push
