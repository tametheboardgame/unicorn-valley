name: WP19D one-shot typecheck diagnostics

on:
  push:
    branches:
      - agent/r6.5-wp19d-unified-interactions-npcs

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r6.5-wp19d-unified-interactions-npcs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture typecheck
        run: npm run typecheck > wp19d-typecheck.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp19d-typecheck.txt
          git commit -m "WP19D capture typecheck diagnostics"
          git push
