name: H0C Browser Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-regression:
    name: H0C settings regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Settings and overlay regressions
        run: >-
          npx playwright test
          tests/play/r6-wp6.14-settings-pause-accessibility.spec.ts
          tests/play/r6.5-wp18i-settings-scroll.spec.ts
          tests/play/r6.5-wp18i-concept-ui.spec.ts
          tests/play/r6.5-wp18i-desktop-concept-ui.spec.ts
          tests/play/r6.5-wp18j-responsive-concept-ui.spec.ts
      - name: Upload H0C regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0c-settings-regression
          path: playtest-artifacts
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: H0C browser compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run existing compatibility matrix
        run: npm run test:browser-compat
      - name: Upload H0C compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h0c-browser-compatibility
          path: browser-compat-artifacts
          if-no-files-found: warn
          retention-days: 14
