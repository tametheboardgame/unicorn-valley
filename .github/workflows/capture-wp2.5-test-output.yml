name: Capture WP2.5 test output

on:
  push:
    branches:
      - agent/r2-wp2.5-willow-moonflowers
    paths-ignore:
      - wp2.5-test-output.txt

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/r2-wp2.5-willow-moonflowers
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Capture tests
        run: npm test > wp2.5-test-output.txt 2>&1 || true
      - name: Commit captured output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wp2.5-test-output.txt
          git diff --cached --quiet || git commit -m "Capture WP2.5 test output"
          git push
