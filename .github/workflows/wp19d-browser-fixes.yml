name: WP19D browser regression patch

on:
  push:
    branches:
      - agent/r6.5-wp19d-unified-interactions-npcs

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r6.5-wp19d-unified-interactions-npcs
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Apply exact regression patch
        run: python scripts/wp19d_browser_fix.py
      - name: Format touched files
        run: npx biome check --write src/game/world/R5RegionGatewayManager.ts src/game/world/R6FinalPlaythroughCleanupManager.ts tests/play/r6-wp6.6-touch-accessibility.spec.ts tests/play/r6.5-wp18i-concept-ui.spec.ts tests/play/r6.5-wp11-existing-valley-quest-pack.spec.ts
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Remove one-shot patch files
        run: rm scripts/wp19d_browser_fix.py .github/workflows/wp19d-browser-fixes.yml
      - name: Commit patched tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align WP19D browser regressions"
          git push origin HEAD:agent/r6.5-wp19d-unified-interactions-npcs
