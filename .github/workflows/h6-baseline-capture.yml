name: H6.0 Crystal Brook Baseline Capture

on:
  push:
    branches:
      - agent/r6.5-wp19h6.0-baseline-audit
    paths:
      - .github/workflows/h6-baseline-capture.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out H6.0 branch
        uses: actions/checkout@v6
        with:
          ref: agent/r6.5-wp19h6.0-baseline-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Measure performance budget
        run: npm run perf:budget

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/h6-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/h6-preview.log
          exit 1

      - name: Capture H6.0 baseline evidence
        env:
          BASELINE_SOURCE_COMMIT: cab55bfbdc98429cfeb324faf11f8509b2dc64c9
        run: node scripts/captureWp19h6Baseline.mjs

      - name: Commit baseline evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/wp19h6-baseline
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "docs(h6.0): capture Crystal Brook baseline evidence"
          git push origin HEAD:agent/r6.5-wp19h6.0-baseline-audit
