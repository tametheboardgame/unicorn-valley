name: Repair package lock

on:
  push:
    branches:
      - agent/fix-cloudflare-package-lock

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Fix package lock for Playwright'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/fix-cloudflare-package-lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Prove clean install works
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lock file
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json did not change; refusing to create an empty repair commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Fix package lock for Playwright'
          git push
