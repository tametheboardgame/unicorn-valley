name: R2-WP2.7 browser validation

on:
  push:
    branches:
      - agent/r2-wp2.7-decorating-v1

permissions:
  contents: write

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2.7-decorating-v1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install project and browser client
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false puppeteer-core
      - name: Expose Phaser game to this diagnostic run only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main.ts')
          text = path.read_text()
          text = text.replace(
              'new Phaser.Game(gameConfig);',
              '(globalThis as typeof globalThis & { __unicornValleyGame?: Phaser.Game }).__unicornValleyGame = new Phaser.Game(gameConfig);',
          )
          path.write_text(text)
          PY
      - name: Start Vite
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/unicorn-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/unicorn-vite.log
          exit 1
      - name: Exercise decorating loop
        run: |
          export CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser)"
          timeout 90s node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox'],
          });
          const page = await browser.newPage();
          page.setDefaultTimeout(10000);
          const errors = [];
          page.on('pageerror', (error) => errors.push(`pageerror: ${error.stack || error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') errors.push(`console: ${message.text()}`);
          });
          const pause = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function waitForCottage() {
            await page.waitForFunction(() =>
              globalThis.__unicornValleyGame?.scene
                .getScenes(true)
                .some((scene) => scene.scene.key === 'CottageInteriorScene') === true,
            );
          }

          async function teleport(x, y) {
            await page.evaluate(({ x, y }) => {
              const scene = globalThis.__unicornValleyGame?.scene.getScene('CottageInteriorScene');
              const player = scene?.player;
              if (!player?.sprite) throw new Error('Could not resolve cottage player.');
              player.sprite.setPosition(x, y);
              player.sprite.body?.reset?.(x, y);
            }, { x, y });
            await pause(250);
          }

          async function interact() {
            await page.keyboard.down('KeyE');
            await pause(260);
            await page.keyboard.up('KeyE');
            await pause(350);
          }

          async function saveState() {
            return page.evaluate(() => JSON.parse(globalThis.localStorage.getItem('unicorn-valley.save')));
          }

          await page.goto('http://127.0.0.1:5173/?scene=cottage', { waitUntil: 'domcontentloaded' });
          await waitForCottage();
          await page.evaluate(() => {
            const raw = globalThis.localStorage.getItem('unicorn-valley.save');
            if (!raw) throw new Error('Cottage did not create a save.');
            const save = JSON.parse(raw);
            save.inventory.itemQuantities['item:moonflower-lantern'] = 1;
            save.home.furnitureBySlot = {};
            globalThis.localStorage.setItem('unicorn-valley.save', JSON.stringify(save));
          });
          await page.reload({ waitUntil: 'domcontentloaded' });
          await waitForCottage();

          await teleport(705, 320);
          const firstTarget = await page.evaluate(() =>
            globalThis.__unicornValleyGame?.scene.getScene('CottageInteriorScene')?.activeInteraction?.id ?? null,
          );
          if (firstTarget !== 'interaction:cottage-decoration:cottage-slot:window-nook') {
            throw new Error(`Unexpected first decoration target: ${firstTarget}`);
          }
          await interact();
          let save = await saveState();
          if (save.home.furnitureBySlot['cottage-slot:window-nook'] !== 'item:moonflower-lantern') {
            throw new Error('Lantern was not placed in the window nook.');
          }
          console.log('PLACED_WINDOW_NOOK=ok');

          await teleport(610, 720);
          await interact();
          save = await saveState();
          if (save.home.furnitureBySlot['cottage-slot:window-nook'] !== undefined) {
            throw new Error('Moving the only lantern left a duplicate in the old slot.');
          }
          if (save.home.furnitureBySlot['cottage-slot:bedside'] !== 'item:moonflower-lantern') {
            throw new Error('Lantern was not moved to bedside.');
          }
          console.log('MOVED_SINGLE_COPY=ok');

          await page.reload({ waitUntil: 'domcontentloaded' });
          await waitForCottage();
          const persistedPlacement = await page.evaluate(() => {
            const scene = globalThis.__unicornValleyGame?.scene.getScene('CottageInteriorScene');
            return scene?.homeView?.placements?.find((placement) => placement.slotId === 'cottage-slot:bedside')?.itemId ?? null;
          });
          if (persistedPlacement !== 'item:moonflower-lantern') {
            throw new Error(`Reload did not reconstruct bedside lantern: ${persistedPlacement}`);
          }
          console.log('RELOAD_PERSISTENCE=ok');

          await teleport(610, 720);
          await interact();
          save = await saveState();
          if (save.home.furnitureBySlot['cottage-slot:bedside'] !== undefined) {
            throw new Error('Cycling the final owned decoration did not remove it.');
          }
          if (save.inventory.itemQuantities['item:moonflower-lantern'] !== 1) {
            throw new Error('Removing a decoration incorrectly consumed inventory ownership.');
          }
          console.log('REMOVE_RETURNS_TO_COLLECTION=ok');

          await page.screenshot({ path: '/tmp/wp2.7-cottage.png' });
          await browser.close();
          if (errors.length > 0) {
            console.error(errors.join('\n'));
            process.exitCode = 1;
          }
          NODE
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-wp2.7-browser-validation
          path: /tmp/wp2.7-cottage.png
          if-no-files-found: ignore
      - name: Remove one-use diagnostic workflow
        if: success()
        run: |
          git checkout -- src/main.ts
          rm .github/workflows/r2-wp2.7-browser-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R2-WP2.7: close browser validation"
          git push origin HEAD:agent/r2-wp2.7-decorating-v1
