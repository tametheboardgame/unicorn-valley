name: Materialise Snow-White and Rose-Red art

on:
  push:
    branches:
      - agent/story-house-snow-white-rose-red

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-snow-white-rose-red

      - name: Download verified public-domain Ubbelohde illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/snow-white-and-rose-red/illustrations
          mkdir -p public/stories/snow-white-and-rose-red/covers

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Otto_Ubbelohde_-_Schneewei%C3%9Fchen_und_Rosenrot.jpg"             -o /tmp/bear.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Otto_Ubbelohde_-_Schneewei%C3%9Fchen_und_Rosenrot_2.jpg"             -o /tmp/dwarf.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Otto_Ubbelohde_-_Schneewei%C3%9Fchen_und_Rosenrot_3.jpg"             -o /tmp/forest.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Otto_Ubbelohde_-_Schneewei%C3%9Fchen_und_Rosenrot_4.jpg"             -o /tmp/ending.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/bear.jpg -strip -quality 92             public/stories/snow-white-and-rose-red/illustrations/bear-at-cottage.webp
          convert /tmp/dwarf.jpg -strip -quality 92             public/stories/snow-white-and-rose-red/illustrations/dwarf.webp
          convert /tmp/forest.jpg -strip -quality 92             public/stories/snow-white-and-rose-red/illustrations/forest.webp
          convert /tmp/ending.jpg -strip -quality 92             public/stories/snow-white-and-rose-red/illustrations/ending.webp

          convert /tmp/bear.jpg             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/snow-white-and-rose-red/covers/cover.webp

      - name: Regenerate Story House catalogue
        run: node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/snow-white-and-rose-red public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Snow-White and Rose-Red art"
          git push origin HEAD:agent/story-house-snow-white-rose-red
