name: R2-WP2.6A cleanup patch

on:
  push:
    branches:
      - agent/r2-wp2.6a-blocker-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2.6a-blocker-fixes
      - name: Remove unsafe manual physics-group teardown
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('src/game/scenes/MoonflowerGladeScene.ts'),
              Path('src/game/scenes/SunbeamVillageScene.ts'),
              Path('src/game/scenes/CottageInteriorScene.ts'),
          ]
          needle = '      this.collisionGroup?.clear(true, true);\n'
          for path in paths:
              text = path.read_text()
              if needle not in text:
                  raise SystemExit(f'Expected cleanup call not found in {path}')
              path.write_text(text.replace(needle, '', 1))

          Path('.github/workflows/r2-wp2.6a-cleanup-patch.yml').unlink()
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "R2-WP2.6A: fix scene shutdown cleanup"
          git push
