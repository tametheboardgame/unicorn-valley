name: WP19D format browser fixes

on:
  push:
    branches:
      - agent/r6.5-wp19d-unified-interactions-npcs

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r6.5-wp19d-unified-interactions-npcs
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Format WP19D files
        run: npx biome format --write src/game/interaction/InteractionTarget.ts src/game/interaction/InteractionTargeting.test.ts src/game/interaction/WorldInteractionCoordinator.ts src/game/world/CottageDepthWorldManager.ts tests/play/r6-wp6.18a-mobile-creator-action.spec.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/wp19d-format.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format WP19D browser fixes"
          git push origin HEAD:agent/r6.5-wp19d-unified-interactions-npcs
