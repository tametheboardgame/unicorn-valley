name: Format R3 WP3.9H

on:
  push:
    branches:
      - agent/r3-wp3.9h-race-flow-recovery

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format R3-WP3.9H files'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v6
        with:
          ref: agent/r3-wp3.9h-race-flow-recovery

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format H files
        run: npx biome format --write src/game/racing/RacePlaytestRecoveryManager.ts tests/play/r3-wp3.9h-race-flow.spec.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/racing/RacePlaytestRecoveryManager.ts tests/play/r3-wp3.9h-race-flow.spec.ts
          git commit -m 'Format R3-WP3.9H files'
          git push
