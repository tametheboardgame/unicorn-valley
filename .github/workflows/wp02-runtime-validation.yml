name: WP0.2 Runtime Validation

on:
  push:
    branches:
      - agent/r0-wp0.2-phaser-vite-typescript-scaffold

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      - name: Start Vite development server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/unicorn-vite.log 2>&1 &
          echo $! > /tmp/unicorn-vite.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ > /tmp/unicorn-index.html; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/unicorn-vite.log
          exit 1

      - name: Install headless browser driver
        run: npm install --no-save puppeteer-core

      - name: Render title scene without browser errors
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "No Chromium-based browser found on runner"
            exit 1
          fi
          export CHROME
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';

          const errors = [];
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME,
            headless: true,
            args: ['--no-sandbox'],
          });

          const page = await browser.newPage();
          page.on('console', (message) => {
            if (message.type() === 'error') {
              errors.push(`console: ${message.text()}`);
            }
          });
          page.on('pageerror', (error) => errors.push(`page: ${error.message}`));
          page.on('requestfailed', (request) => {
            errors.push(`request: ${request.url()} ${request.failure()?.errorText ?? 'failed'}`);
          });

          const response = await page.goto('http://127.0.0.1:5173/', {
            waitUntil: 'networkidle0',
            timeout: 30000,
          });

          if (!response?.ok()) {
            errors.push(`navigation: HTTP ${response?.status() ?? 'unknown'}`);
          }

          await page.waitForSelector('canvas', { timeout: 10000 });
          await new Promise((resolve) => setTimeout(resolve, 1200));

          const state = await page.evaluate(() => {
            const canvas = document.querySelector('canvas');
            return {
              title: document.title,
              canvasWidth: canvas?.width ?? 0,
              canvasHeight: canvas?.height ?? 0,
            };
          });

          if (state.title !== 'Unicorn Valley') {
            errors.push(`title: expected Unicorn Valley, got ${state.title}`);
          }
          if (state.canvasWidth <= 0 || state.canvasHeight <= 0) {
            errors.push('canvas: Phaser canvas did not render');
          }

          await browser.close();

          if (errors.length > 0) {
            console.error(errors.join('\n'));
            process.exit(1);
          }

          console.log(`Rendered ${state.title} at ${state.canvasWidth}x${state.canvasHeight} with no browser errors.`);
          NODE
