name: Materialise Wizard of Oz art

on:
  push:
    branches:
      - agent/story-house-wizard-of-oz

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-wizard-of-oz

      - name: Download verified public-domain W. W. Denslow illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/the-wonderful-wizard-of-oz/illustrations
          mkdir -p public/stories/the-wonderful-wizard-of-oz/covers

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Cover_of_The_Wonderful_Wizard_of_Oz,_1900.png"             -o /tmp/cover.png
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Dorothy_and_the_Scarecrow_1900.jpg"             -o /tmp/scarecrow.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tin_Woodman.png"             -o /tmp/tin.png
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Cowardly_lion.jpg"             -o /tmp/lion.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Emerald_City.jpg"             -o /tmp/emerald.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Wicked_Witch_of_the_West_W.W._Denslow.jpg"             -o /tmp/witch.jpg
          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Glinda.jpg"             -o /tmp/glinda.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/scarecrow.jpg -resize '900x1200>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/scarecrow.webp
          convert /tmp/tin.png -resize '800x1200>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/tin-woodman.webp
          convert /tmp/lion.jpg -resize '900x1200>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/lion.webp
          convert /tmp/emerald.jpg -resize '1000x800>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/emerald-city.webp
          convert /tmp/witch.jpg -resize '800x1000>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/wicked-witch.webp
          convert /tmp/glinda.jpg -resize '800x1100>' -strip -quality 90             public/stories/the-wonderful-wizard-of-oz/illustrations/glinda.webp

          convert /tmp/cover.png             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/the-wonderful-wizard-of-oz/covers/cover.webp

      - name: Format story manifest and regenerate catalogue
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx biome format --write public/stories/the-wonderful-wizard-of-oz/book.json
          node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-wonderful-wizard-of-oz public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Wizard of Oz art"
          git push origin HEAD:agent/story-house-wizard-of-oz
