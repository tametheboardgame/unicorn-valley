name: Format WP1.6 All Once

on:
  push:
    branches:
      - agent/r1-wp1.6-pip-first-discovery

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted-all-wp1.6]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r1-wp1.6-pip-first-discovery

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply repository formatter
        run: npx biome format --write .

      - name: Commit formatting if required
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format WP1.6 repository [formatted-all-wp1.6]"
            git push
          fi
