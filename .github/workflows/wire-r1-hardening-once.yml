name: Wire R1 Hardening Once

on:
  push:
    branches:
      - agent/r1-wp1.8-first-playable-hardening

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wired-r1-hardening]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r1-wp1.8-first-playable-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Wire first-playable hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          title_path = Path('src/game/scenes/TitleScene.ts')
          title = title_path.read_text()

          old = "  private hasCreatedUnicorn = false;"
          new = "  private hasCreatedUnicorn = false;\n  private resetArmed = false;"
          assert old in title
          title = title.replace(old, new, 1)

          old = "    this.starting = false;\n    this.hasCreatedUnicorn = Boolean"
          new = "    this.starting = false;\n    this.resetArmed = false;\n    this.hasCreatedUnicorn = Boolean"
          assert old in title
          title = title.replace(old, new, 1)

          old = "'Press Enter, Space, E or tap the button'"
          new = "'Press Enter or tap the button'"
          assert old in title
          title = title.replace(old, new, 1)

          title = title.replace(".text(GAME_WIDTH / 2, 590, 'Change my unicorn'", ".text(GAME_WIDTH / 2, 580, 'Change my unicorn'", 1)

          old = """    this.statusText = this.add
              .text(
                GAME_WIDTH / 2,
                GAME_HEIGHT - 70,"""
          new = """    if (this.hasCreatedUnicorn) {
              const startOver = this.add
                .text(GAME_WIDTH / 2, 615, 'Start over', {
                  color: '#decff0',
                  fontFamily: 'system-ui, sans-serif',
                  fontSize: '17px',
                })
                .setOrigin(0.5)
                .setInteractive({ useHandCursor: true });
              startOver.on('pointerdown', () => this.requestStartOver(startOver));
            }

            this.statusText = this.add
              .text(
                GAME_WIDTH / 2,
                GAME_HEIGHT - 40,"""
          assert old in title
          title = title.replace(old, new, 1)

          old = "  private enterValley(): void {"
          new = """  private requestStartOver(label: Phaser.GameObjects.Text): void {
            if (this.starting) {
              return;
            }

            if (!this.resetArmed) {
              this.resetArmed = true;
              label.setText('Tap again to start over');
              this.statusText?.setText('This will make a brand-new unicorn. Tap again to be sure.');
              this.time.delayedCall(3500, () => {
                if (!this.resetArmed || this.starting) {
                  return;
                }
                this.resetArmed = false;
                label.setText('Start over');
                this.statusText?.setText('Your unicorn is waiting in Moonflower Glade.');
              });
              return;
            }

            this.starting = true;
            const service = getBrowserSaveService();
            service.save(service.createNewGame());
            this.scene.start('UnicornCreatorScene');
          }

          private enterValley(): void {"""
          assert old in title
          title = title.replace(old, new, 1)
          title_path.write_text(title)

          glade_path = Path('src/game/scenes/MoonflowerGladeScene.ts')
          glade = glade_path.read_text()

          old = "import { PointerTouchInputAdapter } from '../input/PointerTouchInputAdapter';"
          new = """import { PointerTouchInputAdapter } from '../input/PointerTouchInputAdapter';
          import {
            shouldShowTouchMovementPad,
            TouchMovementPad,
          } from '../input/TouchMovementPad';"""
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = "import { getBrowserSaveService } from '../save/browserSaveService';"
          new = """import { getBrowserSaveService } from '../save/browserSaveService';
          import {
            MOONFLOWER_GLADE_LOCATION_ID,
            saveLocationCheckpoint,
          } from '../save/saveLocationCheckpoint';"""
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = "  private dialogueSession: DialogueSession | null = null;"
          new = "  private dialogueSession: DialogueSession | null = null;\n  private touchMovementPad: TouchMovementPad | null = null;"
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = """    const saveService = getBrowserSaveService();
            const save = saveService.load() ?? saveService.createNewGame();"""
          new = """    const saveService = getBrowserSaveService();
            const save = saveLocationCheckpoint(saveService, MOONFLOWER_GLADE_LOCATION_ID);"""
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = """    this.pointerInput = new PointerTouchInputAdapter();
            this.inputController = new InputController([new KeyboardInputAdapter(this), this.pointerInput]);
            this.interactionPrompt = new InteractionPrompt(this, this.pointerInput);"""
          new = """    this.pointerInput = new PointerTouchInputAdapter();
            this.inputController = new InputController([new KeyboardInputAdapter(this), this.pointerInput]);
            if (
              shouldShowTouchMovementPad(
                globalThis.navigator?.maxTouchPoints ?? 0,
                'ontouchstart' in globalThis,
              )
            ) {
              this.touchMovementPad = new TouchMovementPad(this, this.pointerInput);
            }
            this.interactionPrompt = new InteractionPrompt(this, this.pointerInput);"""
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = """      this.pointerInput = null;
              this.interactionPrompt?.destroy();"""
          new = """      this.pointerInput = null;
              this.touchMovementPad?.destroy();
              this.touchMovementPad = null;
              this.interactionPrompt?.destroy();"""
          assert old in glade
          glade = glade.replace(old, new, 1)

          old = "'WASD / arrows to explore  •  E / Enter / Space to interact  •  Escape to title'"
          new = "'Explore, talk to friends, and look for little sparkles ✨'"
          assert old in glade
          glade = glade.replace(old, new, 1)
          glade_path.write_text(glade)

          interactions_path = Path('src/game/interaction/MoonflowerGladeInteractions.ts')
          interactions = interactions_path.read_text()
          old = "'Your cottage interior will become a real place later. For now, the doorway works!'"
          new = "\"The cottage is cosy and quiet. We'll have more to do inside another day.\""
          assert old in interactions
          interactions = interactions.replace(old, new, 1)
          interactions_path.write_text(interactions)
          PY

      - name: Format hardening changes
        run: npx biome format --write .

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire R1 first playable hardening [wired-r1-hardening]"
          git push
