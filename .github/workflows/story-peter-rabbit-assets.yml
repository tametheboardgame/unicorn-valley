name: Materialise Peter Rabbit art

on:
  push:
    branches:
      - agent/story-house-peter-rabbit

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-peter-rabbit

      - name: Download verified public-domain Beatrix Potter illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/the-tale-of-peter-rabbit/illustrations
          mkdir -p public/stories/the-tale-of-peter-rabbit/covers

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/An-Original-Illustration-Of-Peter-Rabbit-From-1902-Author-Beatrix-Potter.jpg"             -o /tmp/cover.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/PeterRabbit4.jpg"             -o /tmp/family.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/PeterRabbit9.jpg"             -o /tmp/garden.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/PeterRabbit24.jpg"             -o /tmp/escape.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/PeterRabbit26.jpg"             -o /tmp/home.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/family.jpg -strip -quality 92             public/stories/the-tale-of-peter-rabbit/illustrations/rabbit-family.webp

          convert /tmp/garden.jpg -strip -quality 92             public/stories/the-tale-of-peter-rabbit/illustrations/garden.webp

          convert /tmp/escape.jpg -strip -quality 92             public/stories/the-tale-of-peter-rabbit/illustrations/escape.webp

          convert /tmp/home.jpg -strip -quality 92             public/stories/the-tale-of-peter-rabbit/illustrations/home.webp

          convert /tmp/cover.jpg             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/the-tale-of-peter-rabbit/covers/cover.webp

      - name: Regenerate Story House catalogue
        run: node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-tale-of-peter-rabbit public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Peter Rabbit art"
          git push origin HEAD:agent/story-house-peter-rabbit
