name: Immutable deployment smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Immutable Cloudflare Pages preview URL for the candidate SHA
        required: true
        type: string
      candidate_sha:
        description: Exact candidate SHA represented by the immutable preview
        required: true
        type: string

permissions:
  contents: read

jobs:
  startup-save-continue:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 161
    name: Startup, save, reload and Continue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}

      - name: Validate immutable Pages URL
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://19e1602a.unicorn-valley.pages.dev' }}
        run: node -e "const url=new URL(process.env.DEPLOYMENT_URL); if(url.protocol!=='https:' || !url.hostname.endsWith('.unicorn-valley.pages.dev')) process.exit(1)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise deployed startup and persistence
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://19e1602a.unicorn-valley.pages.dev' }}
        run: npx playwright test --config=playwright.deployment.config.ts

      - name: Upload deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-deployment-smoke-${{ inputs.candidate_sha || 'pr-161-ebd524b' }}
          path: deployment-smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
