name: Immutable deployment smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Immutable Cloudflare Pages preview URL for the candidate SHA
        required: true
        type: string
      candidate_sha:
        description: Exact candidate SHA represented by the immutable preview
        required: true
        type: string

permissions:
  contents: read

jobs:
  startup-save-continue:
    name: Startup, save, reload and Continue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out qualification metadata
        uses: actions/checkout@v6

      - name: Resolve immutable candidate
        id: candidate
        env:
          INPUT_DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          url="${INPUT_DEPLOYMENT_URL:-$(jq -r .deploymentUrl docs/evidence/wp18k-deployment-candidate.json)}"
          sha="${INPUT_CANDIDATE_SHA:-$(jq -r .deploymentSha docs/evidence/wp18k-deployment-candidate.json)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Validate immutable Pages URL
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
        run: node -e "const url=new URL(process.env.DEPLOYMENT_URL); if(url.protocol!=='https:' || !url.hostname.endsWith('.unicorn-valley.pages.dev')) process.exit(1)"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise deployed startup and persistence
        env:
          DEPLOYMENT_URL: ${{ steps.candidate.outputs.url }}
        run: npx playwright test --config=playwright.deployment.config.ts

      - name: Upload deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immutable-deployment-smoke-${{ steps.candidate.outputs.sha }}
          path: deployment-smoke-artifacts
          if-no-files-found: warn
          retention-days: 14
