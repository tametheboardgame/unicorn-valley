name: Cleanup R1 Hardening Once

on:
  push:
    branches:
      - agent/r1-wp1.8-first-playable-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-r1-hardening]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r1-wp1.8-first-playable-hardening

      - name: Confirm hardening was wired
        run: |
          grep -q "TouchMovementPad" src/game/scenes/MoonflowerGladeScene.ts
          grep -q "resetArmed" src/game/scenes/TitleScene.ts
          grep -q "saveLocationCheckpoint" src/game/scenes/MoonflowerGladeScene.ts

      - name: Remove one-use workflows and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/wire-r1-hardening-once.yml
          rm -f .github/workflows/cleanup-r1-hardening-once.yml
          git add -A
          git commit -m "Remove one-use R1 hardening workflows [cleanup-r1-hardening]"
          git push
