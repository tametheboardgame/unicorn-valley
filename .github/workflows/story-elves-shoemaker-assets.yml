name: Materialise Elves and Shoemaker story art

on:
  push:
    branches:
      - agent/story-house-elves-shoemaker

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-elves-shoemaker

      - name: Download verified public-domain illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/the-elves-and-the-shoemaker/illustrations
          mkdir -p public/stories/the-elves-and-the-shoemaker/covers

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Otto_Ubbelohde_-_Die_Wichtelm%C3%A4nner.jpg"             -o /tmp/ubbelohde.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/GrimmsGoblins-090-TheElvesAndTheShoemaker.jpg"             -o /tmp/cruikshank.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/ubbelohde.jpg -strip -quality 92             public/stories/the-elves-and-the-shoemaker/illustrations/ubbelohde-elves.webp

          convert /tmp/cruikshank.jpg -resize '700x831>' -strip -quality 92             public/stories/the-elves-and-the-shoemaker/illustrations/cruikshank-elves.webp

          convert /tmp/ubbelohde.jpg             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/the-elves-and-the-shoemaker/covers/cover.webp

      - name: Regenerate Story House catalogue
        run: node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-elves-and-the-shoemaker public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Elves and Shoemaker art"
          git push origin HEAD:agent/story-house-elves-shoemaker
