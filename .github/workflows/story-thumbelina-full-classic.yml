name: Materialise Thumbelina Full Classic Text

on:
  push:
    branches:
      - agent/story-house-thumbelina-full-classic
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/story-house-thumbelina-full-classic

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Materialise full classic edition
        shell: python
        run: |
          import json
          import re
          import shutil
          import urllib.request
          from pathlib import Path

          STORY_DIR = Path("public/stories/thumbelina")
          MANIFEST_PATH = STORY_DIR / "book.json"
          PAGES_DIR = STORY_DIR / "editions/full-classic/pages"

          TEXT_URL = "https://www.gutenberg.org/cache/epub/640/pg640.txt"
          BOOK_URL = "https://www.gutenberg.org/ebooks/640"
          START_HEADING = "THUMBELINA"
          END_HEADING = "THE NIGHTINGALE"

          def fetch(url: str) -> bytes:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Unicorn-Valley-Story-House/1.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read()

          def word_count(value: str) -> int:
              return len(re.findall(r"[A-Za-z0-9]+(?:['’.-][A-Za-z0-9]+)*", value))

          def normalise_paragraph(value: str) -> str:
              lines = [line.strip() for line in value.splitlines()]
              return " ".join(line for line in lines if line).strip()

          manifest = json.loads(MANIFEST_PATH.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != 1:
              raise RuntimeError("Expected existing Thumbelina package to be schema v1.")

          raw = fetch(TEXT_URL).decode("utf-8-sig", errors="replace").replace("\r\n", "\n")

          start_matches = list(
              re.finditer(
                  rf"(?m)^\s*{re.escape(START_HEADING)}\s*$",
                  raw,
              )
          )
          if not start_matches:
              raise RuntimeError("Could not find Thumbelina heading in Gutenberg #640.")

          # The contents list includes Thumbelina before the story itself.
          start_match = start_matches[-1]
          remainder = raw[start_match.end():]

          end_match = re.search(
              rf"(?m)^\s*{re.escape(END_HEADING)}\s*$",
              remainder,
          )
          if not end_match:
              raise RuntimeError("Could not find The Nightingale heading after Thumbelina.")

          story = remainder[:end_match.start()].strip()

          paragraphs = [
              normalise_paragraph(block)
              for block in re.split(r"\n\s*\n", story)
          ]
          paragraphs = [paragraph for paragraph in paragraphs if paragraph]
          paragraphs = [
              paragraph for paragraph in paragraphs
              if not re.fullmatch(r"[*\-_ ]{3,}", paragraph)
          ]

          total_words = sum(word_count(paragraph) for paragraph in paragraphs)
          if not 2500 <= total_words <= 5000:
              raise RuntimeError(f"Unexpected Thumbelina word count: {total_words}")

          pages = []
          current = []
          current_words = 0
          for paragraph in paragraphs:
              count = word_count(paragraph)
              if current and current_words >= 210 and current_words + count > 340:
                  pages.append(current)
                  current = []
                  current_words = 0
              current.append(paragraph)
              current_words += count

          if current:
              pages.append(current)

          if len(pages) > 1:
              last_words = sum(word_count(p) for p in pages[-1])
              previous_words = sum(word_count(p) for p in pages[-2])
              if last_words < 130 and previous_words + last_words <= 390:
                  pages[-2].extend(pages[-1])
                  pages.pop()

          if not 8 <= len(pages) <= 18:
              raise RuntimeError(f"Expected 8-18 reader pages, found {len(pages)}")

          if PAGES_DIR.exists():
              shutil.rmtree(PAGES_DIR)
          PAGES_DIR.mkdir(parents=True)

          chapter_manifests = []
          all_blocks = []
          for page_index, page_paragraphs in enumerate(pages, start=1):
              page_id = f"page-{page_index:02d}"
              output = []

              for block_index, paragraph in enumerate(page_paragraphs, start=1):
                  block_id = f"p{page_index:02d}-b{block_index:02d}"
                  output.extend([f"<!-- block:{block_id} -->", paragraph, ""])
                  all_blocks.append(
                      {
                          "page": page_index,
                          "id": block_id,
                          "text": paragraph,
                      }
                  )

              (PAGES_DIR / f"{page_id}.md").write_text(
                  "\n".join(output).rstrip() + "\n",
                  encoding="utf-8",
              )

              chapter_manifests.append(
                  {
                      "id": page_id,
                      "title": "Thumbelina"
                      if page_index == 1
                      else "Thumbelina (continued)",
                      "path": f"editions/full-classic/pages/{page_id}.md",
                  }
              )

          def block_for(needle: str):
              needle_lower = needle.lower()
              for block in all_blocks:
                  if needle_lower in block["text"].lower():
                      return block
              raise RuntimeError(f"Could not locate illustration anchor: {needle}")

          def chapter_for_page(page_number: int):
              return chapter_manifests[page_number - 1]

          anchors = [
              (
                  block_for("there sat a little tiny girl"),
                  {
                      "id": "full-pedersen-thumbelina",
                      "path": "illustrations/pedersen-thumbelina.webp",
                      "alt": "Vilhelm Pedersen's historic illustration of Thumbelina.",
                      "placement": "full-width",
                      "width": 500,
                      "height": 634,
                      "caption": "Illustration by Vilhelm Pedersen.",
                  },
              ),
              (
                  block_for("broad water-lily leaf"),
                  {
                      "id": "full-boyle-water-lily",
                      "path": "illustrations/water-lily.webp",
                      "alt": "Eleanor Vere Boyle's 1872 illustration of Thumbelina on a leaf in the stream.",
                      "placement": "full-width",
                      "width": 1056,
                      "height": 1382,
                      "caption": "Illustration by Eleanor Vere Boyle, 1872.",
                  },
              ),
              (
                  block_for("A great cockchafer came flying past"),
                  {
                      "id": "full-bertall-beetle",
                      "path": "illustrations/beetle.webp",
                      "alt": "Bertall's historic illustration from Thumbelina showing the beetle episode.",
                      "placement": "inline",
                      "width": 648,
                      "height": 648,
                      "caption": "Historic illustration by Bertall.",
                  },
              ),
              (
                  block_for("to the warm countries where the sun shines more brightly"),
                  {
                      "id": "full-boyle-flight-south",
                      "path": "illustrations/flight-south.webp",
                      "alt": "Eleanor Vere Boyle's 1872 illustration of Thumbelina travelling south on the swallow.",
                      "placement": "full-width",
                      "width": 900,
                      "height": 1131,
                      "caption": "Illustration by Eleanor Vere Boyle, 1872.",
                  },
              ),
          ]

          for block, illustration in anchors:
              illustration["blockId"] = block["id"]
              chapter_for_page(block["page"]).setdefault("illustrations", []).append(illustration)

          story_house = {
              "id": "story-house",
              "label": "Story House Edition",
              "author": manifest["author"],
              "readingMode": manifest["readingMode"],
              "rights": manifest["rights"],
              "chapters": manifest["chapters"],
          }

          full_classic = {
              "id": "full-classic",
              "label": "Full Classic Text",
              "author": "Hans Christian Andersen, from Andrew Lang's The Yellow Fairy Book",
              "readingMode": "paged-prose",
              "rights": {
                  "text": {
                      "status": "public-domain",
                      "source": "The Yellow Fairy Book, edited by Andrew Lang; Project Gutenberg eBook #640",
                      "sourceUrl": BOOK_URL,
                      "notes": (
                          "The complete Thumbelina text from the public-domain English edition in Andrew Lang's "
                          "The Yellow Fairy Book is retained without abridgement or modernisation. Project Gutenberg "
                          "front matter, contents and licence boilerplate are excluded."
                      ),
                  },
                  "illustrations": {
                      "status": "public-domain",
                      "source": manifest["rights"]["illustrations"]["source"],
                      "sourceUrl": manifest["rights"]["illustrations"]["sourceUrl"],
                      "notes": (
                          "The four previously verified historical Story House illustrations are reused beside "
                          "matching passages in the complete classic text."
                      ),
                  },
                  "edition": {
                      "status": "public-domain",
                      "source": "Project Gutenberg eBook #640",
                      "notes": "Story House pagination changes presentation only; the source wording remains complete.",
                  },
                  "originalPublicationYear": manifest["rights"]["originalPublicationYear"],
                  "curatorNotes": (
                      f"Complete public-domain English text reflowed into {len(chapter_manifests)} reader pages "
                      "at paragraph boundaries, with four historical illustrations anchored to matching scenes."
                  ),
              },
              "chapters": chapter_manifests,
          }

          upgraded = {
              "schemaVersion": 2,
              "id": manifest["id"],
              "title": manifest["title"],
              "description": manifest["description"],
              "catalogueBlurb": manifest.get("catalogueBlurb"),
              "cover": manifest.get("cover"),
              "series": manifest.get("series"),
              "tags": manifest["tags"],
              "publication": manifest["publication"],
              "discovery": manifest["discovery"],
              "defaultEditionId": "story-house",
              "editions": [story_house, full_classic],
          }

          MANIFEST_PATH.write_text(
              json.dumps(upgraded, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Full classic words: {total_words}")
          print(f"Reader pages: {len(chapter_manifests)}")
          for index, page in enumerate(pages, start=1):
              print(f"page-{index:02d}: {sum(word_count(p) for p in page)} words")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format manifest
        run: npx biome format --write public/stories/thumbelina/book.json

      - name: Regenerate Story House catalogue
        run: npm run story:catalogue

      - name: Run focused Story House tests
        run: npx vitest run src/game/storyLibrary/StoryLibraryService.test.ts src/game/storyLibrary/StoryReadingService.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit materialised edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/stories/thumbelina \
            public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: add Thumbelina Full Classic Text"
          git push origin HEAD:agent/story-house-thumbelina-full-classic
