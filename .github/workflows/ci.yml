name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:
    inputs:
      full_ci:
        description: Force authoritative pre-merge/release Tier 0-4 qualification
        required: true
        default: true
        type: boolean
      pr_number:
        description: Optional PR number to enforce live exact-head validation for manual qualification
        required: false
        type: number
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read
  pull-requests: read
  actions: read

# Superseded commits to the same PR must not consume runner time. Main and
# manually-triggered authoritative runs are never cancelled by newer runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.plan.outputs.head_sha }}
      change_class: ${{ steps.plan.outputs.change_class }}
      tiers: ${{ steps.plan.outputs.tiers }}
      owners: ${{ steps.plan.outputs.owners }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      unit_groups: ${{ steps.plan.outputs.unit_groups }}
      unit_filters: ${{ steps.plan.outputs.unit_filters }}
      unit_related_files: ${{ steps.plan.outputs.unit_related_files }}
      unit_tests: ${{ steps.plan.outputs.unit_tests }}
      browser_group: ${{ steps.plan.outputs.browser_group }}
      browser_groups: ${{ steps.plan.outputs.browser_groups }}
      browser_tests: ${{ steps.plan.outputs.browser_tests }}
      run_typecheck: ${{ steps.plan.outputs.run_typecheck }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_build: ${{ steps.plan.outputs.run_build }}
      run_performance: ${{ steps.plan.outputs.run_performance }}
      run_tier2: ${{ steps.plan.outputs.run_tier2 }}
      run_tier3: ${{ steps.plan.outputs.run_tier3 }}
      run_tier4: ${{ steps.plan.outputs.run_tier4 }}
      run_project_contract: ${{ steps.plan.outputs.run_project_contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Classify change and select verification tiers
        id: plan
        env:
          VERIFY_EVENT_NAME: ${{ github.event_name }}
          VERIFY_EVENT_ACTION: ${{ github.event.action }}
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          VERIFY_PREVIOUS_HEAD_SHA: ${{ github.event.before }}
          VERIFY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFY_FORCE_FULL: ${{ inputs.full_ci || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
        run: node scripts/verification/planVerification.mjs
      - name: Upload verification plan
        uses: actions/upload-artifact@v4
        with:
          name: verification-plan
          path: verification-plan.json
          retention-days: 14

  tier0:
    name: Tier 0 - static and architecture
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      # Report deterministic failures together. A bad formatter diff must not
      # obscure lint, architecture, policy or type-check failures on the same head.
      - name: Check formatting
        id: format
        continue-on-error: true
        run: |
          if ! npm run format:check; then
            npm run format
            git diff -- . > formatting.patch
            echo 'Formatter remediation preview (first 500 lines; complete patch remains an artifact):'
            sed -n '1,500p' formatting.patch
            exit 1
          fi
      - name: Upload formatter remediation
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: formatter-remediation
          path: formatting.patch
          if-no-files-found: warn
          retention-days: 7
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Check architecture boundaries
        id: architecture
        continue-on-error: true
        run: npm run architecture:validate
      - name: Check verification policy
        id: verification-policy
        continue-on-error: true
        run: npm run verification:policy:test
      - name: Validate progressive test impact
        id: test-impact
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/verification/checkTestImpact.mjs
      - name: Validate independent stream-state records
        id: stream-state
        continue-on-error: true
        run: node scripts/verification/streamStatePolicy.mjs
      - name: Enforce product stream ownership at final review
        id: stream-ownership
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/verification/checkStreamOwnership.mjs
      - name: Check performance policy
        id: performance-policy
        continue-on-error: true
        run: npm run performance:policy:test
      - name: Type-check runtime changes
        id: typecheck
        continue-on-error: true
        if: needs.plan.outputs.run_typecheck == 'true'
        run: npm run typecheck
      - name: Set up Python for project contract
        if: needs.plan.outputs.run_project_contract == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate AI project contract
        id: project-contract
        continue-on-error: true
        if: needs.plan.outputs.run_project_contract == 'true'
        run: python scripts/ai/validate-project-state.py
      - name: Consolidate Tier 0 failures
        if: ${{ !cancelled() }}
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          ARCHITECTURE: ${{ steps.architecture.outcome }}
          VERIFICATION_POLICY: ${{ steps.verification-policy.outcome }}
          TEST_IMPACT: ${{ steps.test-impact.outcome }}
          PERFORMANCE_POLICY: ${{ steps.performance-policy.outcome }}
          STREAM_STATE: ${{ steps.stream-state.outcome }}
          STREAM_OWNERSHIP: ${{ steps.stream-ownership.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          PROJECT_CONTRACT: ${{ steps.project-contract.outcome }}
        run: |
          failed=0
          for check in FORMAT LINT ARCHITECTURE VERIFICATION_POLICY TEST_IMPACT PERFORMANCE_POLICY STREAM_STATE STREAM_OWNERSHIP TYPECHECK PROJECT_CONTRACT; do
            if [ "${!check}" = "failure" ]; then
              echo "::error title=Tier 0 ${check} failed::Inspect the preceding ${check} step and formatter remediation artifact if applicable."
              failed=1
            fi
          done
          exit "$failed"

  tier1:
    name: Tier 1 - unit contracts
    needs: [plan, tier0]
    if: needs.plan.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Run selected unit contracts
        env:
          UNIT_MODE: ${{ needs.plan.outputs.unit_mode }}
          UNIT_FILTERS: ${{ needs.plan.outputs.unit_filters }}
          UNIT_RELATED_FILES: ${{ needs.plan.outputs.unit_related_files }}
          UNIT_TESTS: ${{ needs.plan.outputs.unit_tests }}
        run: npm run test:unit:selected

  build-performance:
    name: Build, static smoke and performance architecture
    needs: [plan, tier0]
    if: needs.plan.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Build production bundle with manifest
        run: npm run build
      - name: Smoke-test static output
        run: npm run smoke:static
      - name: Check performance architecture budget
        if: needs.plan.outputs.run_performance == 'true'
        run: npm run perf:budget
      - name: Upload performance report
        if: always() && needs.plan.outputs.run_performance == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.json
          if-no-files-found: warn
          retention-days: 30

  tier2:
    name: Tier 2 - targeted browser smoke
    needs: [plan, tier0]
    if: needs.plan.outputs.run_tier2 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run selected browser contracts
        env:
          BROWSER_TESTS: ${{ needs.plan.outputs.browser_tests }}
        run: npm run test:browser:selected
      - name: Upload targeted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-${{ needs.plan.outputs.browser_group }}
          path: playtest-artifacts
          if-no-files-found: warn
          retention-days: 14

  whole-game-smoke:
    name: Current whole-game smoke
    needs: [plan, tier0]
    if: needs.plan.outputs.run_tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run current whole-game smoke contracts
        run: npx playwright test --config=playwright.smoke.config.ts
      - name: Upload current smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-whole-game-smoke
          path: playtest-smoke-artifacts
          if-no-files-found: warn
          retention-days: 14

  test-discovery:
    name: WP3.1 - full Chromium discovery evidence
    needs: [plan, tier0]
    if: needs.plan.outputs.run_tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Discover complete Playwright test inventory without launching browsers
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-discovery.json
        run: npx playwright test --list --reporter=json
      - name: Normalise source-bound discovery manifest
        env:
          TEST_EVIDENCE_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: node scripts/verification/playwrightEvidence.mjs --input=playwright-discovery.json --output=discovery-manifest.json --discovery
      # WP3.3 startup: candidate evidence only. The actual runners remain the
      # six already-qualified static shards until separate explicit activation.
      - name: Load bounded healthy duration history (candidate only)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verification/fetchSuiteHealthHistory.mjs --output=wp33-history.json --metadata=wp33-history-metadata.json
      - name: Generate SHA-bound full-inventory candidate (no execution authority)
        if: always()
        continue-on-error: true
        env:
          TEST_EVIDENCE_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: node scripts/verification/adaptiveShardPlan.mjs --discovery=discovery-manifest.json --history=wp33-history.json --output=adaptive-candidate.json
      - name: Upload complete discovery manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-test-discovery
          path: |
            playwright-discovery.json
            discovery-manifest.json
            adaptive-candidate.json
            wp33-history-metadata.json
          if-no-files-found: warn
          retention-days: 14

  # PR #316-only execution canary; protected main and other PRs retain static-six.
  tier3-execution-plan:
    name: WP3.3 - select protected Tier 3 mode
    needs: [plan, tier0, test-discovery]
    if: needs.plan.outputs.run_tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
      mode: ${{ steps.choose.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
      - name: Download independent discovery and candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: chromium-test-discovery
          path: discovery-evidence
      - name: Select static-six or isolated manifest-six
        id: choose
        env:
          TEST_EVIDENCE_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          WP33_CANARY: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 316 }}
        run: node scripts/verification/tier3Matrix.mjs --candidate=discovery-evidence/adaptive-candidate.json --discovery=discovery-evidence/discovery-manifest.json --output=tier3-execution-plan.json
      - name: Upload auditable execution choice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp33-tier3-execution-plan
          path: tier3-execution-plan.json
          if-no-files-found: warn
          retention-days: 14

  tier3:
    name: Tier 3 - full Chromium (${{ matrix.shard }}/6)
    needs: [plan, tier0, tier1, tier3-execution-plan]
    if: needs.plan.outputs.run_tier3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.tier3-execution-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download independent discovery for manifest canary
        if: matrix.mode == 'manifest6'
        uses: actions/download-artifact@v4
        with:
          name: chromium-test-discovery
          path: discovery-evidence
      - name: Run qualified static-six Playwright shard
        if: matrix.mode == 'static6'
        run: npm run test:play -- --shard=${{ matrix.shard }}/6
      - name: Run manifest-six canary and verify actual test identities
        if: matrix.mode == 'manifest6'
        env:
          TEST_EVIDENCE_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        run: node scripts/verification/runAdaptiveShard.mjs --candidate=discovery-evidence/adaptive-candidate.json --discovery=discovery-evidence/discovery-manifest.json --shard=${{ matrix.shard }}
      - name: Summarise automated findings
        if: always()
        run: node scripts/summarisePlaytest.mjs
      - name: Emit WP3.1 per-shard execution evidence
        if: always()
        continue-on-error: true
        env:
          TEST_EVIDENCE_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          TEST_EVIDENCE_SHARD: ${{ matrix.shard }}/6
        run: node scripts/verification/playwrightEvidence.mjs --input=playtest-artifacts/playwright-results.json --output=playtest-artifacts/test-evidence.json
      - name: Upload playtest report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-chromium-${{ matrix.shard }}-of-6
          path: playtest-artifacts
          if-no-files-found: warn
          retention-days: 14

  tier4:
    name: Tier 4 - cross-browser compatibility
    needs: [plan, tier0, tier1]
    if: needs.plan.outputs.run_tier4 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Confirm required browser profiles are selected
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.compat.config.ts --list > browser-profiles.txt
          for profile in chromium-desktop firefox-desktop webkit-desktop chromium-tablet-touch webkit-tablet-touch chromium-mobile-touch webkit-mobile-touch; do
            if ! grep -Fq "[$profile]" browser-profiles.txt; then
              echo "::error::Missing required browser profile $profile from compatibility selection."
              exit 1
            fi
          done
          echo "All seven required compatibility profiles have selected tests."
      - name: Run compatibility matrix
        run: npm run test:browser-compat
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier4-browser-compatibility
          path: browser-compat-artifacts
          if-no-files-found: warn
          retention-days: 14

  test-evidence:
    name: WP3.1 - reconcile Chromium evidence (observational)
    needs: [plan, tier3, test-discovery]
    if: ${{ always() && needs.plan.outputs.run_tier3 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Download independent test discovery
        uses: actions/download-artifact@v4
        with:
          name: chromium-test-discovery
          path: discovery-evidence
      - name: Download six shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: tier3-chromium-*-of-6
          path: shard-evidence
      - name: Reconcile discovered and recorded identities
        continue-on-error: true
        run: node scripts/verification/reconcilePlaywrightArtifacts.mjs --manifest=discovery-evidence/discovery-manifest.json --shards=shard-evidence --output=reconciliation-report.json
      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-evidence-reconciliation
          path: reconciliation-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retrieve bounded historical suite-health artifacts from main
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verification/fetchSuiteHealthHistory.mjs --output=suite-health-history.json --metadata=suite-health-history-metadata.json
      - name: Produce WP2.4 suite health (observational)
        if: always()
        continue-on-error: true
        run: node scripts/verification/suiteHealth.mjs --reconciliation=reconciliation-report.json --shards=shard-evidence --history=suite-health-history.json --output=suite-health.json --markdown=suite-health.md
      - name: Propose ENG-WP3.2 shadow shard allocations (observational only)
        if: always()
        continue-on-error: true
        run: node scripts/verification/shadowShardPlanner.mjs --health=suite-health.json --shards=shard-evidence --history=suite-health-history.json --output=shadow-shards.json --markdown=shadow-shards.md
      - name: Upload WP2.4 suite health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-health
          path: |
            suite-health.json
            suite-health.md
            suite-health-history-metadata.json
            shadow-shards.json
            shadow-shards.md
          if-no-files-found: warn
          retention-days: 14

  merge-gate:
    name: Merge Gate
    needs: [plan, tier0, tier1, build-performance, tier2, whole-game-smoke, tier3, tier4]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Enforce exact-head verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PLAN_HEAD: ${{ needs.plan.outputs.head_sha }}
          PLAN_CLASS: ${{ needs.plan.outputs.change_class }}
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_UNIT: ${{ needs.plan.outputs.run_unit }}
          RUN_BUILD: ${{ needs.plan.outputs.run_build }}
          RUN_TIER2: ${{ needs.plan.outputs.run_tier2 }}
          RUN_TIER3: ${{ needs.plan.outputs.run_tier3 }}
          RUN_TIER4: ${{ needs.plan.outputs.run_tier4 }}
          RESULT_TIER0: ${{ needs.tier0.result }}
          RESULT_TIER1: ${{ needs.tier1.result }}
          RESULT_BUILD: ${{ needs.build-performance.result }}
          RESULT_TIER2: ${{ needs.tier2.result }}
          RESULT_SMOKE: ${{ needs.whole-game-smoke.result }}
          RESULT_TIER3: ${{ needs.tier3.result }}
          RESULT_TIER4: ${{ needs.tier4.result }}
        run: node scripts/verification/checkMergeGate.mjs
