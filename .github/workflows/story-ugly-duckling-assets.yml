name: Materialise Ugly Duckling art

on:
  push:
    branches:
      - agent/story-house-ugly-duckling

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-ugly-duckling

      - name: Download verified public-domain Vilhelm Pedersen illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/the-ugly-duckling/illustrations
          mkdir -p public/stories/the-ugly-duckling/covers

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duckling_01.jpg"             -o /tmp/duckyard.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Den_grimme_%C3%A6lling._Hos_den_gamle_kone.jpg"             -o /tmp/little-house.jpg

          curl -L --fail --retry 3             "https://commons.wikimedia.org/wiki/Special:Redirect/file/Duckling_03.jpg"             -o /tmp/swans.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/duckyard.jpg -strip -quality 92             public/stories/the-ugly-duckling/illustrations/duckyard.webp

          convert /tmp/little-house.jpg -resize '900x1200>' -strip -quality 92             public/stories/the-ugly-duckling/illustrations/little-house.webp

          convert /tmp/swans.jpg -strip -quality 92             public/stories/the-ugly-duckling/illustrations/swans.webp

          convert /tmp/duckyard.jpg             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/the-ugly-duckling/covers/cover.webp

      - name: Regenerate Story House catalogue
        run: node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-ugly-duckling public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Ugly Duckling art"
          git push origin HEAD:agent/story-house-ugly-duckling
