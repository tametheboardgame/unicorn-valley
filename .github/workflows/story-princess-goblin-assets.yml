name: Materialise Princess and the Goblin art

on:
  push:
    branches:
      - agent/story-house-princess-goblin

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-princess-goblin

      - name: Download public-domain Jessie Willcox Smith illustrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/stories/the-princess-and-the-goblin/illustrations
          mkdir -p public/stories/the-princess-and-the-goblin/covers

          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/coverpage.jpg"             -o /tmp/cover.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col01.jpg"             -o /tmp/col01.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col02.jpg"             -o /tmp/col02.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col03.jpg"             -o /tmp/col03.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col04.jpg"             -o /tmp/col04.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col05.jpg"             -o /tmp/col05.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col06.jpg"             -o /tmp/col06.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col07.jpg"             -o /tmp/col07.jpg
          curl -L --fail --retry 3             "https://www.gutenberg.org/cache/epub/34339/images/col08.jpg"             -o /tmp/col08.jpg

      - name: Convert illustrations to Story House WebP assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert /tmp/col01.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/lost-in-the-house.webp
          convert /tmp/col02.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/pigeons.webp
          convert /tmp/col03.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/goblins.webp
          convert /tmp/col04.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/king-papa.webp
          convert /tmp/col05.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/grandmother.webp
          convert /tmp/col06.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/curdie-torch.webp
          convert /tmp/col07.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/curdie-follows.webp
          convert /tmp/col08.jpg -resize '900x1300>' -strip -quality 90             public/stories/the-princess-and-the-goblin/illustrations/safe-at-home.webp

          convert /tmp/cover.jpg             -resize '420x520>'             -gravity center             -background '#f6f0df'             -extent 480x640             -strip -quality 92             public/stories/the-princess-and-the-goblin/covers/cover.webp

      - name: Format story manifest and regenerate catalogue
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx biome format --write public/stories/the-princess-and-the-goblin/book.json
          node scripts/generateStoryCatalogue.mjs

      - name: Commit materialised story assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/stories/the-princess-and-the-goblin public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Princess and the Goblin art"
          git push origin HEAD:agent/story-house-princess-goblin
