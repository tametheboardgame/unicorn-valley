name: R3 WP3.8 Format Fix

on:
  push:
    branches:
      - agent/r3-wp3.8-racing-presentation-pass

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/r3-wp3.8-racing-presentation-pass

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format WP3.8 files
        run: >-
          npx biome format --write
          src/game/racing/RacePresentation.test.ts
          src/game/racing/RacePresentation.ts
          src/game/scenes/NovaTutorialRaceScene.ts
          src/game/scenes/RaceScene.ts

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/racing/RacePresentation.test.ts src/game/racing/RacePresentation.ts src/game/scenes/NovaTutorialRaceScene.ts src/game/scenes/RaceScene.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(r3): apply Biome formatting [skip ci]"
          git push origin HEAD:agent/r3-wp3.8-racing-presentation-pass
