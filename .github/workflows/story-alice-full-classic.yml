name: Materialise Alice Full Classic Text

on:
  push:
    branches:
      - agent/story-house-alice-full-classic

permissions:
  contents: write

jobs:
  materialise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-house-alice-full-classic

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Download complete public-domain Alice text
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://www.gutenberg.org/cache/epub/11/pg11.txt" \
            -o /tmp/alice-full.txt

      - name: Build paged Full Classic Text edition
        shell: python
        run: |
          import json
          import re
          import shutil
          from pathlib import Path

          story_dir = Path("public/stories/alices-adventures-in-wonderland")
          manifest_path = story_dir / "book.json"
          source_path = Path("/tmp/alice-full.txt")
          pages_dir = story_dir / "editions/full-classic/pages"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("schemaVersion") != 1:
              raise RuntimeError("Alice materialiser expected the existing schema v1 Story House package.")

          source = source_path.read_text(encoding="utf-8").replace("\r\n", "\n")
          start_marker = "CHAPTER I.\nDown the Rabbit-Hole"
          start = source.find(start_marker)
          if start < 0:
              raise RuntimeError("Could not locate the first Alice chapter in the public-domain source.")
          end = source.find("\nTHE END", start)
          if end < 0:
              raise RuntimeError("Could not locate THE END in the public-domain source.")
          novel = source[start:end].strip()

          chapter_pattern = re.compile(r"(?m)^CHAPTER ([IVX]+)\.\n([^\n]+)\n")
          matches = list(chapter_pattern.finditer(novel))
          if len(matches) != 12:
              raise RuntimeError(f"Expected 12 original chapters, found {len(matches)}.")

          def word_count(value: str) -> int:
              return len(re.findall(r"[A-Za-z0-9]+(?:[’'-][A-Za-z0-9]+)*", value))

          def normalise_block(raw: str) -> str | None:
              lines = [line.rstrip() for line in raw.splitlines()]
              lines = [line for line in lines if line.strip() != "[Illustration]"]
              if not lines:
                  return None
              compact = "".join(line.strip() for line in lines)
              if compact and set(compact) <= {"*"}:
                  return None

              indented = sum(1 for line in lines if line.startswith("    "))
              if indented >= 2:
                  rendered = "\n".join(f"> {line.strip()}" for line in lines if line.strip())
              else:
                  rendered = " ".join(line.strip() for line in lines if line.strip())

              rendered = re.sub(r"_([^_]+)_", r"*\1*", rendered)
              rendered = re.sub(r" {2,}", " ", rendered)
              return rendered.strip() or None

          chapter_titles = []
          chapter_blocks = []
          for index, match in enumerate(matches):
              end_pos = matches[index + 1].start() if index + 1 < len(matches) else len(novel)
              raw_body = novel[match.end():end_pos].strip()
              blocks = [
                  block
                  for raw in re.split(r"\n\s*\n", raw_body)
                  if (block := normalise_block(raw)) is not None
              ]
              if not blocks:
                  raise RuntimeError(f"Chapter {index + 1} contained no usable text blocks.")
              chapter_titles.append((match.group(1), match.group(2).strip()))
              chapter_blocks.append(blocks)

          target_words = 320
          max_words = 390
          all_pages = []

          for chapter_index, blocks in enumerate(chapter_blocks, start=1):
              pages = []
              current = []
              current_words = 0

              for block in blocks:
                  block_words = word_count(block)
                  if current and current_words >= target_words and current_words + block_words > max_words:
                      pages.append(current)
                      current = []
                      current_words = 0

                  current.append(block)
                  current_words += block_words

                  if current_words >= max_words:
                      pages.append(current)
                      current = []
                      current_words = 0

              if current:
                  pages.append(current)

              if len(pages) > 1 and word_count("\n".join(pages[-1])) < 140:
                  pages[-2].extend(pages[-1])
                  pages.pop()

              all_pages.append(pages)

          if pages_dir.exists():
              shutil.rmtree(pages_dir)
          pages_dir.mkdir(parents=True, exist_ok=True)

          legacy_chapters = manifest["chapters"]
          if len(legacy_chapters) != 12:
              raise RuntimeError("Expected the Story House edition to have 12 chapters.")

          full_chapters = []
          total_words = 0
          total_pages = 0

          for chapter_index, pages in enumerate(all_pages, start=1):
              roman, chapter_title = chapter_titles[chapter_index - 1]
              legacy_illustrations = legacy_chapters[chapter_index - 1].get("illustrations", [])

              for page_index, blocks in enumerate(pages, start=1):
                  total_pages += 1
                  page_id = f"chapter-{chapter_index:02d}-page-{page_index:02d}"
                  page_path = f"editions/full-classic/pages/ch{chapter_index:02d}-p{page_index:02d}.md"
                  page_lines = []
                  first_block_id = None

                  for block_index, block in enumerate(blocks, start=1):
                      block_id = f"ch{chapter_index:02d}-p{page_index:02d}-b{block_index:02d}"
                      if first_block_id is None:
                          first_block_id = block_id
                      page_lines.append(f"<!-- block:{block_id} -->")
                      page_lines.append(block)
                      page_lines.append("")
                      total_words += word_count(block)

                  (story_dir / page_path).write_text(
                      "\n".join(page_lines).rstrip() + "\n",
                      encoding="utf-8",
                  )

                  page_title = (
                      f"Chapter {roman}. {chapter_title}"
                      if page_index == 1
                      else f"{chapter_title} (continued)"
                  )
                  page_manifest = {
                      "id": page_id,
                      "title": page_title,
                      "path": page_path,
                  }

                  if page_index == 1 and legacy_illustrations and first_block_id:
                      page_manifest["illustrations"] = [
                          {
                              **illustration,
                              "id": f"full-{illustration['id']}",
                              "blockId": first_block_id,
                          }
                          for illustration in legacy_illustrations
                      ]

                  full_chapters.append(page_manifest)

          if total_words < 24000:
              raise RuntimeError(
                  f"Generated classic text is unexpectedly short at {total_words} words."
              )
          if total_pages < 60:
              raise RuntimeError(
                  f"Generated classic text has only {total_pages} pages; pagination is too coarse."
              )

          story_house_edition = {
              "id": "story-house",
              "label": "Story House Edition",
              "author": manifest["author"],
              "readingMode": manifest.get("readingMode", "flowing"),
              "rights": manifest["rights"],
              "chapters": manifest["chapters"],
          }

          full_classic_edition = {
              "id": "full-classic",
              "label": "Full Classic Text",
              "author": "Lewis Carroll",
              "readingMode": "paged-prose",
              "rights": {
                  "text": {
                      "status": "public-domain",
                      "source": "Lewis Carroll's 1865 text, transcribed in Project Gutenberg eBook #11",
                      "sourceUrl": "https://www.gutenberg.org/ebooks/11",
                      "notes": (
                          "Complete novel text. Project Gutenberg header, footer, licence text and "
                          "standalone [Illustration] placeholders are excluded; prose wording is not "
                          "abridged or modernised."
                      ),
                  },
                  "illustrations": manifest["rights"].get("illustrations"),
                  "edition": {
                      "status": "public-domain",
                      "source": "Historic Lewis Carroll text with John Tenniel illustrations",
                      "notes": (
                          "Story House pagination is a presentation layer only. The classic wording "
                          "remains unabridged."
                      ),
                  },
                  "originalPublicationYear": 1865,
                  "curatorNotes": (
                      f"Complete public-domain text split into {total_pages} reader pages at paragraph "
                      "boundaries. Original twelve chapter divisions are preserved."
                  ),
              },
              "chapters": full_chapters,
          }

          converted = {
              "schemaVersion": 2,
              "id": manifest["id"],
              "title": manifest["title"],
              "description": manifest["description"],
              "catalogueBlurb": manifest.get("catalogueBlurb"),
              "cover": manifest.get("cover"),
              "series": manifest.get("series"),
              "tags": manifest["tags"],
              "publication": manifest["publication"],
              "discovery": manifest["discovery"],
              "defaultEditionId": "story-house",
              "editions": [story_house_edition, full_classic_edition],
          }

          manifest_path.write_text(
              json.dumps(converted, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              f"Materialised Alice Full Classic Text: {total_words} words, "
              f"{total_pages} pages, 12 original chapters."
          )

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format changed source and manifest
        shell: bash
        run: |
          set -euo pipefail
          npx biome format --write \
            src/game/storyLibrary/StoryLibraryTypes.ts \
            src/game/storyLibrary/StoryLibraryService.ts \
            src/game/storyLibrary/StoryLibraryService.test.ts \
            src/game/storyLibrary/StoryReaderOverlay.ts \
            scripts/generateStoryCatalogue.mjs \
            public/stories/alices-adventures-in-wonderland/book.json

      - name: Regenerate Story House catalogue
        run: npm run story:catalogue

      - name: Run focused Story House tests
        run: npx vitest run src/game/storyLibrary/StoryLibraryService.test.ts src/game/storyLibrary/StoryReadingService.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit materialised classic edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/game/storyLibrary/StoryLibraryTypes.ts \
            src/game/storyLibrary/StoryLibraryService.ts \
            src/game/storyLibrary/StoryLibraryService.test.ts \
            src/game/storyLibrary/StoryReaderOverlay.ts \
            scripts/generateStoryCatalogue.mjs \
            public/stories/alices-adventures-in-wonderland \
            public/stories/catalogue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Story House: materialise Alice Full Classic Text"
          git push origin HEAD:agent/story-house-alice-full-classic
