name: R2-WP2.7 format pass

on:
  push:
    branches:
      - agent/r2-wp2.7-decorating-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-wp2.7-decorating-v1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Format WP2.7 source and remove one-use workflow
        run: |
          npm run format
          rm .github/workflows/r2-wp2.7-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "R2-WP2.7: format decorating implementation"
          git push origin HEAD:agent/r2-wp2.7-decorating-v1
