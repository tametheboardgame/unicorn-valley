name: Materialise Generated Asset from Drive (trusted main only)

# Privileged imports must be launched from the reviewed main workflow.
# Automatic agent/* push imports are intentionally disabled: branch code is not trusted with GCP OIDC.
on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Repository-relative generated asset manifest path
        required: true
        type: string
      target_branch:
        description: Existing agent/* development branch to update
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: generated-asset-materialisation-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  materialise:
    # Prevent a caller running a modified copy of this workflow from an agent branch.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      MANIFEST_PATH: ${{ inputs.manifest_path }}
      ASSET_REPOSITORY_ROOT: ${{ github.workspace }}/work
      ASSET_CONFIG_PATH: ${{ github.workspace }}/trusted/generated-assets/config.json

    steps:
      - name: Check out reviewed import logic and policy from main
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Validate request without evaluating branch strings
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted/scripts/generated-assets/validate_request.py "$TARGET_BRANCH" "$MANIFEST_PATH"
          printf 'branch=%s\n' "$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Check out development branch as untrusted data
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.branch }}
          path: work
          fetch-depth: 2

      - name: Verify manifest exists in isolated worktree
        shell: bash
        run: |
          set -euo pipefail
          test -f "work/$MANIFEST_PATH"
          test -f "$ASSET_CONFIG_PATH"

      - name: Resolve Google workload identity provider
        id: provider
        shell: bash
        env:
          CONFIGURED_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          provider="${CONFIGURED_PROVIDER#https://iam.googleapis.com/}"
          provider="${provider#//iam.googleapis.com/}"
          [[ "$provider" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[A-Za-z0-9_-]+/providers/[A-Za-z0-9_-]+$ ]] || {
            echo "::error::Invalid GCP workload identity provider configuration"
            exit 1
          }
          echo "resource=$provider" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud via OIDC
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          workload_identity_provider: ${{ steps.provider.outputs.resource }}
          service_account: ${{ vars.GCP_ASSET_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install image and read-only Drive tooling
        run: python -m pip install --disable-pip-version-check pillow google-api-python-client google-auth

      - name: Materialise using only reviewed main-branch Python and config
        shell: bash
        run: |
          set -euo pipefail
          python trusted/scripts/generated-assets/materialise_drive_asset.py --manifest "$MANIFEST_PATH"

      - name: Validate output and commit only approved generated image
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          from PIL import Image

          root = Path(os.environ["ASSET_REPOSITORY_ROOT"]).resolve()
          manifest = (root / os.environ["MANIFEST_PATH"]).resolve()
          if root not in manifest.parents:
              raise SystemExit("Manifest escapes development worktree")
          obj = json.loads(manifest.read_text(encoding="utf-8"))
          rel = Path(obj["destination"])
          if rel.is_absolute() or ".." in rel.parts or rel.suffix.lower() != ".webp":
              raise SystemExit("Invalid generated destination")
          output = (root / rel).resolve()
          if root not in output.parents or not output.is_file():
              raise SystemExit("Generated image missing or outside worktree")
          with Image.open(output) as image:
              image.verify()
          subprocess.run(["git", "-C", str(root), "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "-C", str(root), "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "-C", str(root), "add", "--", str(rel)], check=True)
          changed = subprocess.run(["git", "-C", str(root), "diff", "--cached", "--quiet"], check=False)
          if changed.returncode == 0:
              print("Verified image is unchanged; nothing to commit.")
              raise SystemExit(0)
          if changed.returncode != 1:
              raise SystemExit("Failed to compare generated image")
          subprocess.run(["git", "-C", str(root), "commit", "-m", "Assets: materialise generated image from Drive"], check=True)
          subprocess.run(["git", "-C", str(root), "push", "origin", "HEAD:" + os.environ["TARGET_BRANCH"]], check=True)
